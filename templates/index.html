<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational AI Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="chat-container">

```
<div class="chat-header">
    <h1>FAQ Chatbox</h1>
    <p>Ask me about Maths, Physics, Chemistry, Biology, AI, Programming, Space & more.</p>
</div>

<div id="chat-box" class="chat-box">
    <div class="message bot-message">
        Hello! 👋 Ask me any educational question.
    </div>
</div>

<div class="input-area">
    <input
        type="text"
        id="user-input"
        placeholder="Type your question..."
        autocomplete="off"
    >

    <button id="send-button">Send</button>
</div>
```

</div>

<script>
const input = document.getElementById("user-input");
const sendButton = document.getElementById("send-button");
const chatBox = document.getElementById("chat-box");

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type + "-message";
    message.textContent = text;
    chatBox.appendChild(message);

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    input.value = "";
    sendButton.disabled = true;

    try {

        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        if (data.response) {
            addMessage(data.response, "bot");
        } else {
            addMessage("Sorry, I received an empty response.", "bot");
        }

    } catch (error) {

        console.error(error);

        addMessage(
            "Sorry, I could not connect to the chatbot.",
            "bot"
        );

    }

    sendButton.disabled = false;
    input.focus();
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
